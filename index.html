<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#174c36">
<title>ILIRI COLOR</title>
<style>
:root{
  --green:#174c36; --green2:#246a4d; --gold:#d8b04d;
  --bg:#f4f4f1; --card:#fff; --text:#1f2723; --muted:#68736d;
  --border:#d9dfdb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body{min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 4px 10px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:42px;height:42px;border-radius:12px;background:var(--green);
  display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:20px;
  box-shadow:0 2px 8px #0002
}
h1{font-size:21px;margin:0;letter-spacing:.4px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px;box-shadow:0 2px 10px #0000000c}
.stage{
  position:relative;width:100%;min-height:390px;background:#e6e9e7;border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
canvas{display:block;max-width:100%;width:100%;height:auto;touch-action:none}
.empty{
  text-align:center;padding:50px 20px;color:var(--muted)
}
.empty .cam{font-size:54px}
.empty button{margin-top:14px}
input[type=file]{display:none}
.controls{padding:13px 2px 2px}
.controls-title{font-size:14px;font-weight:700;margin:0 0 9px 2px}
.palette{
  display:flex;gap:10px;overflow-x:auto;padding:3px 2px 10px;scrollbar-width:none
}
.palette::-webkit-scrollbar{display:none}
.swatch{
  flex:0 0 48px;height:48px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 0 0 1px #bcc5c0,0 2px 6px #0002;position:relative
}
.swatch.active:after{
  content:"✓";position:absolute;inset:0;display:grid;place-items:center;
  font-size:22px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000
}
.colorline{display:flex;gap:9px;align-items:center;margin-top:3px}
.colorline label{font-size:13px;color:var(--muted)}
.colorline input[type=color]{
  width:45px;height:34px;border:0;padding:0;background:transparent
}
.actions{
  display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px
}
button{
  border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:700;
  background:var(--green);color:white
}
button.secondary{background:#ecefeb;color:#24302a;border:1px solid var(--border)}
button.danger{background:#a63b3b}
button:disabled{opacity:.45}
.hint{
  margin:10px 4px 2px;font-size:13px;line-height:1.35;color:var(--muted)
}
.status{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  background:#111c;color:white;border-radius:999px;padding:8px 12px;font-size:12px;
  opacity:0;pointer-events:none;transition:.2s;white-space:nowrap
}
.status.show{opacity:1}
.compareBadge{
  position:absolute;top:12px;right:12px;background:#111c;color:#fff;
  border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;display:none
}
.compareBadge.show{display:block}
@media(min-width:700px){
  .stage{min-height:540px}
  .actions{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">IC</div>
      <div>
        <h1>ILIRI COLOR</h1>
        <div class="sub">Provo ngjyrat direkt mbi dhomë</div>
      </div>
    </div>
    <button class="secondary" id="newPhotoBtn" style="padding:10px 12px">Foto</button>
  </header>

  <div class="card">
    <div class="stage" id="stage">
      <div class="empty" id="emptyState">
        <div class="cam">📷</div>
        <div>Vendos një foto të dhomës</div>
        <button id="openPhotoBtn">Zgjidh foton</button>
      </div>
      <canvas id="canvas" hidden></canvas>
      <div class="compareBadge" id="compareBadge">PARA</div>
      <div class="status" id="status"></div>
    </div>

    <div class="controls" id="controls" hidden>
      <div class="controls-title">Zgjidh ngjyrën</div>
      <div class="palette" id="palette"></div>

      <div class="colorline">
        <label for="customColor">Ngjyrë tjetër:</label>
        <input id="customColor" type="color" value="#d7d1c5">
      </div>

      <div class="actions">
        <button class="secondary" id="undoBtn">↶ Kthim pas</button>
        <button class="secondary" id="compareBtn">◐ Krahaso</button>
        <button id="saveBtn">⬇ Ruaj foton</button>
        <button class="danger" id="deleteBtn">🗑 Fshi</button>
      </div>

      <div class="hint">
        Zgjidh një ngjyrë dhe pastaj prek faqen e murit që do të lyesh.
        Aplikacioni ndjek zonën e lidhur rreth pikës së prekur dhe ruan dritë-hijet e fotos.
      </div>
    </div>
  </div>

  <input id="photoInput" type="file" accept="image/*">
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const input = document.getElementById('photoInput');
  const empty = document.getElementById('emptyState');
  const controls = document.getElementById('controls');
  const stage = document.getElementById('stage');
  const palette = document.getElementById('palette');
  const custom = document.getElementById('customColor');
  const statusEl = document.getElementById('status');
  const badge = document.getElementById('compareBadge');

  const colors = [
    '#f2efe6','#e3ddd0','#d5cfc1','#c9b9a7','#b8a99a',
    '#d7e0d2','#b9c9b6','#95aa91','#8fa7ae','#becbd0',
    '#d6c4c7','#c5a7ab','#d9c696','#c9a86a','#af9075',
    '#b9b7b0','#8e928e','#686d6a','#454b49','#252b29'
  ];
  let selected = colors[0];
  let original = null;
  let history = [];
  let comparing = false;
  let isPainting = false;

  function toast(t){
    statusEl.textContent=t;
    statusEl.classList.add('show');
    clearTimeout(toast.t);
    toast.t=setTimeout(()=>statusEl.classList.remove('show'),1600);
  }

  colors.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='swatch'+(i===0?' active':'');
    b.style.background=c;
    b.title=c;
    b.dataset.color=c;
    b.addEventListener('click',()=>{
      selected=c;
      custom.value=c;
      [...palette.children].forEach(x=>x.classList.toggle('active',x===b));
    });
    palette.appendChild(b);
  });

  custom.addEventListener('input',()=>{
    selected=custom.value;
    [...palette.children].forEach(x=>x.classList.remove('active'));
  });

  document.getElementById('openPhotoBtn').onclick=()=>input.click();
  document.getElementById('newPhotoBtn').onclick=()=>input.click();

  input.addEventListener('change', e=>{
    const f=e.target.files && e.target.files[0];
    if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        // Keep image reasonably sized for iPhone memory.
        const max=1600;
        let w=img.naturalWidth,h=img.naturalHeight;
        const s=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*s); h=Math.round(h*s);
        canvas.width=w; canvas.height=h;
        ctx.drawImage(img,0,0,w,h);
        original=ctx.getImageData(0,0,w,h);
        history=[];
        canvas.hidden=false; empty.hidden=true; controls.hidden=false;
        fitStage();
        toast('Fotoja u ngarkua');
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
    input.value='';
  });

  function fitStage(){
    if(!canvas.width) return;
    const ratio=canvas.height/canvas.width;
    canvas.style.width='100%';
    canvas.style.height='auto';
    stage.style.minHeight='0';
    stage.style.aspectRatio = canvas.width + ' / ' + canvas.height;
  }

  function hexRgb(hex){
    const n=parseInt(hex.slice(1),16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  const lum=(r,g,b)=>0.2126*r+0.7152*g+0.0722*b;
  const dist=(a,b)=>{
    // perceptual-ish RGB distance, emphasizing luminance less than chroma.
    const dr=a[0]-b[0], dg=a[1]-b[1], db=a[2]-b[2];
    return Math.sqrt(0.30*dr*dr+0.59*dg*dg+0.11*db*db);
  };

  function sampleStats(data,w,h,x,y){
    const vals=[];
    const rad=3;
    for(let yy=Math.max(0,y-rad); yy<=Math.min(h-1,y+rad); yy++){
      for(let xx=Math.max(0,x-rad); xx<=Math.min(w-1,x+rad); xx++){
        const i=(yy*w+xx)*4;
        vals.push([data[i],data[i+1],data[i+2]]);
      }
    }
    const avg=[0,0,0];
    vals.forEach(v=>{avg[0]+=v[0];avg[1]+=v[1];avg[2]+=v[2]});
    avg[0]/=vals.length;avg[1]/=vals.length;avg[2]/=vals.length;
    let variance=0;
    vals.forEach(v=>variance+=dist(v,avg)**2);
    variance/=vals.length;
    return {avg, std:Math.sqrt(variance)};
  }

  function gradientAt(data,w,h,x,y){
    const xm=Math.max(0,x-1), xp=Math.min(w-1,x+1);
    const ym=Math.max(0,y-1), yp=Math.min(h-1,y+1);
    const i1=(y*w+xm)*4, i2=(y*w+xp)*4;
    const i3=(ym*w+x)*4, i4=(yp*w+x)*4;
    const gx=Math.abs(lum(data[i2],data[i2+1],data[i2+2])-lum(data[i1],data[i1+1],data[i1+2]));
    const gy=Math.abs(lum(data[i4],data[i4+1],data[i4+2])-lum(data[i3],data[i3+1],data[i3+2]));
    return gx+gy;
  }

  function paintRegion(x,y){
    if(!original || isPainting || comparing) return;
    isPainting=true;
    const current=ctx.getImageData(0,0,canvas.width,canvas.height);
    history.push(current);
    if(history.length>12) history.shift();

    const w=canvas.width,h=canvas.height,d=current.data;
    const stats=sampleStats(d,w,h,x,y);
    const seed=stats.avg;
    // Auto tolerance: enough for shaded wall, conservative around corners/objects.
    const colorTol=Math.max(25,Math.min(58,27+stats.std*1.15));
    const localTol=Math.max(22,Math.min(48,24+stats.std*.8));
    const edgeLimit=Math.max(42,Math.min(78,52+stats.std*.7));

    const N=w*h;
    const seen=new Uint8Array(N);
    const mask=new Uint8Array(N);
    const qx=new Int32Array(N);
    const qy=new Int32Array(N);
    let head=0,tail=0;
    qx[tail]=x; qy[tail]=y; tail++;
    let count=0;

    while(head<tail){
      const cx=qx[head], cy=qy[head]; head++;
      if(cx<0||cy<0||cx>=w||cy>=h) continue;
      const p=cy*w+cx;
      if(seen[p]) continue;
      seen[p]=1;
      const i=p*4;
      const c=[d[i],d[i+1],d[i+2]];
      if(dist(c,seed)>colorTol) continue;
      if(gradientAt(d,w,h,cx,cy)>edgeLimit && Math.abs(cx-x)+Math.abs(cy-y)>8) continue;

      // Nearby color continuity prevents jumping across different surfaces.
      if(cx>0){
        const j=(cy*w+cx-1)*4;
        if(dist(c,[d[j],d[j+1],d[j+2]])>localTol) continue;
      }
      mask[p]=1; count++;

      if(cx>0){qx[tail]=cx-1;qy[tail]=cy;tail++}
      if(cx<w-1){qx[tail]=cx+1;qy[tail]=cy;tail++}
      if(cy>0){qx[tail]=cx;qy[tail]=cy-1;tail++}
      if(cy<h-1){qx[tail]=cx;qy[tail]=cy+1;tail++}
      if(tail>=N) break;
    }

    // If selection is suspiciously huge, retry more conservatively.
    if(count > N*0.48){
      history.pop();
      conservativePaint(x,y,current,Math.max(18,colorTol*.72),Math.max(33,edgeLimit*.72));
      isPainting=false;
      return;
    }

    applyMask(current,mask,count);
    isPainting=false;
  }

  function conservativePaint(x,y,current,colorTol,edgeLimit){
    const w=canvas.width,h=canvas.height,d=current.data,N=w*h;
    history.push(current);
    const seedI=(y*w+x)*4;
    const seed=[d[seedI],d[seedI+1],d[seedI+2]];
    const seen=new Uint8Array(N), mask=new Uint8Array(N);
    const queue=new Int32Array(N);
    let head=0,tail=0; queue[tail++]=y*w+x; let count=0;
    while(head<tail){
      const p=queue[head++]; if(seen[p])continue; seen[p]=1;
      const cy=(p/w)|0,cx=p-cy*w,i=p*4;
      const c=[d[i],d[i+1],d[i+2]];
      if(dist(c,seed)>colorTol)continue;
      if(gradientAt(d,w,h,cx,cy)>edgeLimit && Math.abs(cx-x)+Math.abs(cy-y)>5)continue;
      mask[p]=1;count++;
      if(cx>0)queue[tail++]=p-1;
      if(cx<w-1)queue[tail++]=p+1;
      if(cy>0)queue[tail++]=p-w;
      if(cy<h-1)queue[tail++]=p+w;
      if(tail>=N)break;
    }
    applyMask(current,mask,count);
  }

  function applyMask(image,mask,count){
    const w=canvas.width,h=canvas.height,d=image.data;
    const [tr,tg,tb]=hexRgb(selected);

    // Soften mask 1 px at borders by checking neighbours.
    for(let p=0;p<mask.length;p++){
      if(!mask[p]) continue;
      const y=(p/w)|0,x=p-y*w,i=p*4;
      const L=lum(d[i],d[i+1],d[i+2])/255;
      // Preserve light/shadow and some original character.
      const shade=0.50+L*0.62;
      const nr=Math.min(255,tr*shade), ng=Math.min(255,tg*shade), nb=Math.min(255,tb*shade);
      let alpha=.76;
      let neighbours=0;
      if(x>0&&mask[p-1])neighbours++;
      if(x<w-1&&mask[p+1])neighbours++;
      if(y>0&&mask[p-w])neighbours++;
      if(y<h-1&&mask[p+w])neighbours++;
      if(neighbours<3) alpha=.48;
      d[i]=d[i]*(1-alpha)+nr*alpha;
      d[i+1]=d[i+1]*(1-alpha)+ng*alpha;
      d[i+2]=d[i+2]*(1-alpha)+nb*alpha;
    }
    ctx.putImageData(image,0,0);
    if(count<80) toast('Prek pak më në qendër të faqes');
    else toast('Faqja u ngjyros');
  }

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    const x=Math.max(0,Math.min(canvas.width-1,Math.floor((t.clientX-r.left)*canvas.width/r.width)));
    const y=Math.max(0,Math.min(canvas.height-1,Math.floor((t.clientY-r.top)*canvas.height/r.height)));
    return {x,y};
  }
  canvas.addEventListener('click', e=>{
    const p=pointFromEvent(e);
    paintRegion(p.x,p.y);
  });

  document.getElementById('undoBtn').onclick=()=>{
    if(!history.length){toast('Nuk ka veprim për t’u kthyer');return}
    ctx.putImageData(history.pop(),0,0);
  };

  const showOriginal=()=>{
    if(!original||comparing)return;
    comparing=true;
    window.__painted=ctx.getImageData(0,0,canvas.width,canvas.height);
    ctx.putImageData(original,0,0);
    badge.classList.add('show');
  };
  const showPainted=()=>{
    if(!comparing)return;
    comparing=false;
    if(window.__painted)ctx.putImageData(window.__painted,0,0);
    badge.classList.remove('show');
  };
  const cb=document.getElementById('compareBtn');
  cb.addEventListener('pointerdown',showOriginal);
  cb.addEventListener('pointerup',showPainted);
  cb.addEventListener('pointercancel',showPainted);
  cb.addEventListener('pointerleave',showPainted);

  document.getElementById('saveBtn').onclick=()=>{
    if(!canvas.width)return;
    const a=document.createElement('a');
    a.download='ILIRI-COLOR-'+new Date().toISOString().slice(0,10)+'.jpg';
    a.href=canvas.toDataURL('image/jpeg',.94);
    document.body.appendChild(a);a.click();a.remove();
    toast('Fotoja u ruajt');
  };

  document.getElementById('deleteBtn').onclick=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    canvas.width=0;canvas.height=0;
    original=null;history=[];window.__painted=null;
    canvas.hidden=true;controls.hidden=true;empty.hidden=false;
    stage.style.aspectRatio='';stage.style.minHeight='';
    toast('Fotoja u fshi');
  };
})();
</script>
</body>
</html>
