<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b5b3c">
<title>ILIRI COLORS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f4f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152019}
.app{max-width:900px;margin:auto;padding:8px 8px 20px}
header{height:64px;background:#0b5b3c;color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:#08462f;color:#e0b84d;display:grid;place-items:center;font-weight:900}
h1{font-size:22px;margin:0;letter-spacing:.3px}.sub{font-size:11px;color:#dce9e3;margin-top:2px}
.topbtn{border:1px solid #ffffff99;background:transparent;color:#fff;border-radius:11px;padding:9px 12px;font-weight:800}
.stage{position:relative;background:#dfe4e1;border-radius:18px;overflow:hidden;min-height:72vh;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;color:#65716a;padding:60px 20px}.empty .cam{font-size:52px;margin-bottom:8px}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:800;font-size:14px}
.primary{background:#0b5b3c;color:#fff}.secondary{background:#fff;color:#17201c;border:1px solid #d5ddd8}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.loading{position:absolute;inset:0;background:#ffffffdf;display:none;align-items:center;justify-content:center;text-align:center;z-index:8;padding:25px}
.loading.show{display:flex}.spin{width:34px;height:34px;border:4px solid #d8dfdb;border-top-color:#0b5b3c;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}
.status{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#102018e8;color:#fff;padding:8px 12px;border-radius:999px;font-size:12px;white-space:nowrap;display:none;z-index:7}.status.show{display:block}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px;position:sticky;bottom:8px;z-index:10}
.colorBtn{width:54px;height:54px;border-radius:50%;padding:4px;background:#fff;border:2px solid #0b5b3c;display:grid;place-items:center;flex:0 0 54px}
.colorBtn span{display:block;width:40px;height:40px;border-radius:50%;background:#f2efe6;border:1px solid #bbb}
.colorPicker{position:absolute;opacity:0;width:1px;height:1px}
.bar .secondary,.bar .primary{height:54px}
.bar .wide{flex:1}
input[type=file]{display:none}
.note{font-size:12px;color:#6d7771;text-align:center;margin:7px 4px 0}
@media(max-width:430px){.stage{min-height:68vh}h1{font-size:20px}.bar button{font-size:12px;padding:8px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">IC</div><div><h1>ILIRI COLORS</h1><div class="sub">Zgjidh ngjyrën dhe prek murin</div></div></div>
  <button class="topbtn" id="photoBtn">Foto</button>
</header>

<div class="stage" id="stage">
  <div class="empty" id="empty"><div class="cam">📷</div><div>Ngarko foton e dhomës</div><button class="primary" id="chooseBtn" style="margin-top:14px">Zgjidh foton</button></div>
  <canvas id="canvas" hidden></canvas>
  <div class="loading" id="loading"><div><div class="spin"></div><b id="loadTitle">Po ngarkohet AI…</b><div style="font-size:12px;color:#68736d;margin-top:5px">Herën e parë mund të zgjasë pak.</div></div></div>
  <div class="status" id="status"></div>
</div>

<div class="bar" id="bar" hidden>
  <label class="colorBtn" for="colorPicker" title="Të gjitha ngjyrat"><span id="colorDot"></span></label>
  <input class="colorPicker" id="colorPicker" type="color" value="#f2efe6">
  <button class="secondary" id="undoBtn">↶ Kthim</button>
  <button class="secondary" id="clearBtn">Fshij</button>
  <button class="primary wide" id="saveBtn">Ruaj foton</button>
</div>
<div class="note" id="note" hidden>Prek rrethin e ngjyrës për të zgjedhur çdo ngjyrë të mundshme. Pastaj prek direkt faqen e murit.</div>
<input id="fileInput" type="file" accept="image/*">
</div>

<script type="module">
import {env,SamModel,AutoProcessor,RawImage,Tensor} from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';
env.allowLocalModels=false;
const MODEL='Xenova/slimsam-77-uniform';

const c=document.getElementById('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
const file=document.getElementById('fileInput'), empty=document.getElementById('empty'), bar=document.getElementById('bar'), note=document.getElementById('note');
const loading=document.getElementById('loading'), loadTitle=document.getElementById('loadTitle'), status=document.getElementById('status');
const picker=document.getElementById('colorPicker'), dot=document.getElementById('colorDot');

let color=picker.value, original=null, history=[], model=null, processor=null, imageInputs=null, embeddings=null, busy=false;

function toast(t){status.textContent=t;status.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>status.classList.remove('show'),1800)}
picker.addEventListener('input',()=>{color=picker.value;dot.style.background=color;toast('Ngjyra u zgjodh')});
dot.style.background=color;
document.getElementById('chooseBtn').onclick=()=>file.click();
document.getElementById('photoBtn').onclick=()=>file.click();

async function getAI(){
  if(model&&processor)return;
  loading.classList.add('show'); loadTitle.textContent='Po ngarkohet AI…';
  try{
    [model,processor]=await Promise.all([
      SamModel.from_pretrained(MODEL,{quantized:true}),
      AutoProcessor.from_pretrained(MODEL)
    ]);
  } finally { loading.classList.remove('show'); }
}

file.onchange=async()=>{
  const f=file.files?.[0]; if(!f)return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=async()=>{
    let w=img.naturalWidth,h=img.naturalHeight;
    const s=Math.min(1,1600/Math.max(w,h)); w=Math.round(w*s);h=Math.round(h*s);
    c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);
    original=ctx.getImageData(0,0,w,h);history=[];
    c.hidden=false;empty.hidden=true;bar.hidden=false;note.hidden=false;
    document.getElementById('stage').style.minHeight='0';
    URL.revokeObjectURL(url);
    try{
      await getAI();
      loading.classList.add('show');loadTitle.textContent='AI po analizon foton…';
      const raw=await RawImage.read(c.toDataURL('image/jpeg',.92));
      imageInputs=await processor(raw);
      embeddings=await model.get_image_embeddings(imageInputs);
      toast('Gati — zgjidh ngjyrën dhe prek murin');
    }catch(e){console.error(e);toast('AI nuk u ngarkua — provo përsëri');}
    finally{loading.classList.remove('show')}
  };
  img.src=url;file.value='';
};

function point(ev){const r=c.getBoundingClientRect();return[(ev.clientX-r.left)*c.width/r.width,(ev.clientY-r.top)*c.height/r.height]}
function hex(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

async function segmentAt(x,y){
  const orig=imageInputs.original_sizes[0];
  const px=x/c.width*orig[1], py=y/c.height*orig[0];
  const input_points=new Tensor('float32',[px,py],[1,1,1,2]);
  const input_labels=new Tensor('int64',[1],[1,1,1]);
  const out=await model({...embeddings,input_points,input_labels});
  const masks=await processor.post_process_masks(out.pred_masks,imageInputs.original_sizes,imageInputs.reshaped_input_sizes);
  const m=masks[0];
  const scores=out.iou_scores.data;
  let best=0; for(let i=1;i<scores.length;i++) if(scores[i]>scores[best]) best=i;
  const H=m.dims[m.dims.length-2], W=m.dims[m.dims.length-1];
  const plane=H*W, start=Math.min(best*plane,Math.max(0,m.data.length-plane));
  return {data:m.data,start,W,H};
}

function applyMask(M){
  history.push(ctx.getImageData(0,0,c.width,c.height));
  const img=ctx.getImageData(0,0,c.width,c.height), d=img.data, [tr,tg,tb]=hex(color);
  for(let y=0;y<c.height;y++){
    const my=Math.min(M.H-1,Math.floor(y*M.H/c.height));
    for(let x=0;x<c.width;x++){
      const mx=Math.min(M.W-1,Math.floor(x*M.W/c.width));
      if(M.data[M.start+my*M.W+mx]>0.0){
        const i=(y*c.width+x)*4;
        const lum=(d[i]+d[i+1]+d[i+2])/765;
        const a=.68, shade=.72+lum*.30;
        d[i]=Math.round(d[i]*(1-a)+tr*a*shade);
        d[i+1]=Math.round(d[i+1]*(1-a)+tg*a*shade);
        d[i+2]=Math.round(d[i+2]*(1-a)+tb*a*shade);
      }
    }
  }
  ctx.putImageData(img,0,0);
}

c.addEventListener('pointerup',async ev=>{
  if(!embeddings||busy)return;
  busy=true; const [x,y]=point(ev);
  loading.classList.add('show');loadTitle.textContent='Po lyhet faqja…';
  try{const M=await segmentAt(x,y);applyMask(M);toast('U lye faqja e zgjedhur');}
  catch(e){console.error(e);toast('Nuk u bë — prek përsëri murin');}
  finally{loading.classList.remove('show');busy=false}
});

document.getElementById('undoBtn').onclick=()=>{if(!history.length)return;ctx.putImageData(history.pop(),0,0);toast('U kthye pas')};
document.getElementById('clearBtn').onclick=()=>{if(!original)return;ctx.putImageData(original,0,0);history=[];toast('Fotoja u pastrua')};
document.getElementById('saveBtn').onclick=()=>{if(!original)return;const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download='ILIRI-COLORS.jpg';document.body.appendChild(a);a.click();a.remove()};
</script>
</body>
</html>
